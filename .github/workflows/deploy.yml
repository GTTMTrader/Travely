# main 브랜치에 올리면 GitHub Pages 로 자동 배포 (무료).
# 저장소 Settings > Pages > Source 를 'GitHub Actions' 로 한 번 설정해 두면 끝.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build   # Firebase 웹 설정은 .env.production 에서 읽음 (공개돼도 되는 값)
      - run: node scripts/build-archive.mjs dist/archive.html   # 여행 백업 보기 앱 (백업 파일에 같이 담김)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
